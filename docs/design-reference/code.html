<script>
        // Simple micro-interaction for tool selection
        document.querySelectorAll('.glass-panel button').forEach(button => {
            button.addEventListener('click', function() {
                if(this.parentElement.children.length > 3) { // Selection panel only
                    document.querySelectorAll('.glass-panel button').forEach(b => {
                        b.classList.remove('bg-primary-container', 'text-on-primary-container', 'active-tool');
                        b.classList.add('text-on-surface-variant');
                    });
                    this.classList.remove('text-on-surface-variant');
                    this.classList.add('bg-primary-container', 'text-on-primary-container', 'active-tool');
                }
            });
        });

        // Toggle simulation for drawing (visual only)
        const court = document.querySelector('.court-pattern');
        court.addEventListener('mousedown', () => {
           court.style.cursor = 'crosshair';
        });
        court.addEventListener('mouseup', () => {
           court.style.cursor = 'default';
        });
    </script>
